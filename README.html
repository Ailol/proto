<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #05060a;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 80px;
      box-sizing: border-box;
    }

    .nords-touch {
      display: inline-block;
      padding: 4px;
      border-radius: 36px;

      background:
        linear-gradient(
          135deg,
          rgba(0, 255, 255, 1),
          rgba(120, 70, 255, 0.8),
          rgba(255, 0, 190, 0.95),
          rgba(255, 210, 80, 1)
        );

      box-shadow:
        0 0 8px rgba(255,255,255,0.75),
        0 0 20px rgba(0,255,255,0.70),
        0 0 42px rgba(105,70,255,0.60),
        0 0 72px rgba(255,0,190,0.42),
        0 0 110px rgba(80,180,255,0.28),
        0 24px 70px rgba(0,0,0,0.80);
    }

    .glass {
      padding: 8px;
      border-radius: 32px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.20),
          rgba(255,255,255,0.035)
        );

      border: 1px solid rgba(255,255,255,0.55);

      box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.65),
        inset 0 -2px 14px rgba(0,0,0,0.55);

      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
    }

    .glass img {
      width: 620px;
      max-width: 90vw;
      height: auto;
      display: block;
      border-radius: 25px;

      box-shadow:
        0 0 12px rgba(130,190,255,0.30),
        0 0 35px rgba(130,60,255,0.20);
    }
  </style>
</head>

<body>

  <div class="nords-touch">
    <div class="glass">
      <img
        src="./src/The%20Nordzs/3.after/1.png"
        alt="Munin / Hugin"
      />
    </div>
  </div>

</body>
</html>
